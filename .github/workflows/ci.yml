
name: Iris ML Continuous Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Train Iris model
        run: python train_model.py

      - name: Check model quality
        run: |
          python -c "import json; m=json.load(open('metrics.json')); print('Accuracy:', m['accuracy']); assert m['accuracy'] >= 0.85, 'Model accuracy is below 0.85'"

      - name: Run API tests
        run: pytest -v test_app.py

      - name: Package release candidate
        run: |
          mkdir -p release
          cp app.py iris_model.pkl metrics.json requirements.txt release/
          echo "Iris prediction API release candidate" > release/README.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: iris-api-release-candidate
          path: release/
          retention-days: 7
